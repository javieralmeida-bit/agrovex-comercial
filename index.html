<style>
/* VOICE: herramienta de terreno, cercana y ordenada; habla como un técnico agrícola.
   IDEA: la libreta de campo del técnico Agrovex: lo que toca hoy, cada productor, cada compromiso.
   PICTURE: la lista "Hoy toca" y el tablero de etapas son la imagen; el logo encabeza cada página.
   COLOUR and TYPE: verde hoja #3F8E49, verde bosque #1B3A27, ocre #CB7818 y miel #F6AE44 sobre papel #F5F2EA; Lora para títulos, Inter para el resto.
   LAYOUT: barra lateral verde con logo en escritorio; barra inferior en el teléfono; contenido hasta 1180px. */
:root{color-scheme:light dark;
--bg:light-dark(#F5F2EA,#0F1E15);--paper:light-dark(#FCFBF7,#17291D);--ink:light-dark(#22302A,#E8EFE6);--muted:light-dark(#5B685F,#A9B8AC);
--line:light-dark(#E2DDD0,#2A3F31);--forest:#1B3A27;--leaf:#3F8E49;--leafs:light-dark(#E4ECDD,#21402B);--ocre:#CB7818;--ocret:light-dark(#8A4E1C,#E9A65A);--honey:#F6AE44;--sand:light-dark(#F1E3CF,#3A2C19);
--red:light-dark(#B3261E,#F08A80);--reds:light-dark(#FBE2DF,#3D1B18);--amber:light-dark(#8A5A00,#F2C46B);--ambers:light-dark(#FDF0D2,#3A2E12)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,Arial,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Lora,Georgia,serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,4vw,40px)}h2{font-size:22px}h3{font-size:17px;font-family:Inter,Arial,sans-serif;font-weight:700}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
nav.side{background:var(--forest);color:#FCFBF7;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
nav.side .brand{padding:4px 8px 18px;border-bottom:1px solid #2F5A3A;margin-bottom:10px}
nav.side .brand img{width:170px;display:block}
nav.side .brand small{display:block;color:#BFD3C4;font-size:13px;margin-top:6px}
nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#DCE7DA;text-decoration:none;font-weight:500;min-height:44px}
nav a svg{width:22px;height:22px;flex:none}
nav a:hover{background:#24492F}nav a.on{background:var(--leaf);color:#fff}
nav.side .foot{margin-top:auto;font-size:13px;color:#8FB09A;padding:8px}
main{padding:clamp(18px,3vw,40px);max-width:1180px;width:100%}
.top{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top .mark{width:46px;height:46px;flex:none}
.top .tt{flex:1 1 260px}
.mbar{display:none}
.top p{margin:4px 0 0;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer;background:var(--leaf);color:#fff;display:inline-flex;align-items:center;gap:8px}
.btn.alt{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.oc{background:var(--ocre)}.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.kpi b{display:block;font-size:clamp(24px,3vw,32px);font-family:Lora,Georgia,serif;color:var(--forest)}
:root[data-theme=dark] .kpi b{color:#CFE3CC}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .kpi b{color:#CFE3CC}}
.kpi span{color:var(--muted);font-size:14px}
.kpi.warn b{color:var(--red)}.kpi.oc b{color:var(--ocret)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:14px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .who{font-weight:700}.item .sub{color:var(--muted);font-size:14px}
.item .amt{font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--leafs);color:var(--forest);white-space:nowrap}
:root[data-theme=dark] .tag{color:#CFE3CC}
.tag.r{background:var(--reds);color:var(--red)}.tag.a{background:var(--ambers);color:var(--amber)}.tag.o{background:var(--sand);color:var(--ocret)}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
.draft{grid-column:1/-1;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:15px}
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{flex:0 0 250px;background:var(--leafs);border-radius:16px;padding:10px;scroll-snap-align:start}
.col h3{display:flex;justify-content:space-between;padding:4px 6px 10px;font-size:14px;text-transform:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;display:block}
.card:hover{border-color:var(--leaf)}
.card .m{font-weight:700;font-variant-numeric:tabular-nums}
.card .d{font-size:13px;color:var(--muted)}
.card.late{border-left:5px solid var(--red)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select,#pSel{min-height:44px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--paper)}
.toolbar input{flex:1;min-width:180px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--leafs)}
.bars .row{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bars .track{background:var(--leafs);border-radius:8px;height:22px;overflow:hidden}
.bars .fill{height:100%;background:var(--leaf);border-radius:8px}
.bars .fill.o{background:var(--ocre)}
.bars .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px}
.sheet h3{margin:18px 0 6px;color:var(--ocret)}
.sheet ul,.sheet ol{margin:4px 0;padding-left:22px}
.sheet .head{display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--ocre);padding-bottom:12px}
.sheet .head img{width:130px}
.guide details{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:0 16px}
.guide summary{cursor:pointer;font-weight:700;padding:14px 0;min-height:44px}
.guide details p,.guide details li{color:var(--ink)}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;position:relative;padding:6px 0 10px 46px}
.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:32px;height:32px;border-radius:50%;background:var(--leaf);color:#fff;font-weight:700;display:grid;place-items:center}
.hero{background:var(--forest);color:#FCFBF7;border-radius:22px;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;margin-bottom:22px;position:relative;overflow:hidden}
.hero h1{color:#FCFBF7}.hero p{color:#BFD3C4;margin:8px 0 0}
.hero img{width:200px}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--ocre)}
.overlay{position:fixed;inset:0;background:rgba(10,20,14,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--paper);border-radius:20px;width:min(680px,100%);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.modal header svg{width:34px;height:34px;flex:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px;background:var(--bg);font-weight:400;color:var(--ink)}
.form textarea{min-height:70px;resize:vertical}
.alert{border-radius:12px;padding:10px 14px;font-size:14px;margin:8px 0}
.alert.r{background:var(--reds);color:var(--red)}.alert.a{background:var(--ambers);color:var(--amber)}.alert.g{background:var(--leafs)}
.login{max-width:420px;margin:6vh auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:28px;text-align:center;border-bottom:6px solid var(--ocre)}.login img{width:220px;margin-bottom:10px}.login .form{text-align:left;margin-top:16px}.login .btn{justify-content:center}
.mfoot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--forest);color:#fff;padding:10px 18px;border-radius:24px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none}
.toast.show{opacity:1}
.status{font-size:13px;color:var(--muted)}
nav.tabs{display:none}
body.out nav,body.out .mbar{display:none!important}body.out .app{grid-template-columns:minmax(0,1fr)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){
.app{grid-template-columns:minmax(0,1fr)}nav.side{display:none}

.mbar{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:var(--paper);border-bottom:3px solid var(--ocre);position:sticky;top:0;z-index:30}.mbar img{height:34px}.mbar span{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--forest);z-index:40;justify-content:space-around;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
nav.tabs a{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;color:#DCE7DA;border-radius:10px;flex:1}
nav.tabs a svg{width:22px;height:22px}
main{padding-bottom:96px}
.hero{grid-template-columns:minmax(0,1fr)}.hero img{width:150px;order:-1}
.form{grid-template-columns:minmax(0,1fr)}
.bars .row{grid-template-columns:100px minmax(0,1fr) 90px}
}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--muted);font-size:13px}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.view{animation:in .35s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
@media print{nav,.btn,.toolbar{display:none!important}.app{display:block}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="iso" viewBox="0 0 64 64">
    <path d="M38 22c10-3 20 2 22 10-2 10-12 17-24 15l-6 8 1-9c-6-6-3-21 7-24z" fill="#F6AE44"/>
    <path d="M47 30c-5 3-9 7-12 13" stroke="#CB7818" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M6 10c14-6 30 0 34 13 3 12-5 23-18 24l-9 11 1-12C4 40 0 22 6 10z" fill="#3F8E49"/>
    <path d="M11 15c5 9 10 18 14 27" stroke="#FCFBF7" stroke-width="3" fill="none" stroke-linecap="round"/>
  </symbol>
</svg>
<div class="app">
  <nav class="side" aria-label="Secciones">
    <div class="brand"><img src="logo-white.png" alt="Agrovex"><small>Sistema Comercial</small></div>
    <div id="navSide"></div>
    <div class="foot"><span id="who"></span><br><button class="btn sm alt" id="logout" style="margin-top:8px;display:none">Cerrar sesión</button><br><br>La app prepara.<br>Agrovex decide y envía.</div>
  </nav>
  <div><header class="mbar"><img src="logo-color.png" alt="Agrovex"><button class="btn sm alt" id="logoutM" style="display:none">Salir</button></header><main id="main"><div class="empty">Cargando…</div></main></div>
</div>
<nav class="tabs" id="navTabs" aria-label="Secciones"></nav>
<div class="overlay" id="ov" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
{
const ICONS={
inicio:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
lunes:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15l2 2 4-4"/>',
tablero:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/>',
clientes:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-4 3.4-6 6.5-6s5.7 2 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .7 3.2 2.6 3.5 6"/>',
visita:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
cierre:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
guia:'<path d="M4 4h7a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H4zM20 4h-3a3 3 0 0 0-3 3"/><path d="M20 4v13.5h-6"/>'};
const ico=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[k]+'</svg>';
const PAGES=[['inicio','Inicio'],['lunes','Lunes'],['tablero','Tablero'],['clientes','Clientes'],['visita','Visita'],['cierre','Cierre'],['guia','Guía']];
const ETAPAS=['prospecto','consulta','visita realizada','ensayo en curso','cotización enviada','seguimiento','ganada','perdida','pausada'];
const ABIERTAS=ETAPAS.slice(0,6);
const COMUNAS=['Malloa','San Vicente de Tagua Tagua','Rengo','Quinta de Tilcoco','Doñihue','Coltauco','Peumo','Otra'];
const RESP=['Carlos Oleas','Javier Almeida'];
const MOTIVOS=['precio','plazo de pago','compró a otro','no contestó más','no era su temporada','producto no disponible','resultado de ensayo','deuda vencida','otro'];
const FUENTES=['visita','WhatsApp','llamada','correo','referido','otro'];

const S={db:null,sample:null,cli:[],ops:[],ready:false,err:'',drafts:{},periodo:null,visita:''};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clp=n=>'$'+Math.round(+n||0).toLocaleString('es-CL');
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const pd=s=>s?new Date(s+'T12:00:00'):null;
const days=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fmt=s=>s?pd(s).toLocaleDateString('es-CL',{day:'2-digit',month:'short'}):'—';
function bdays(a,b){let n=0,d=pd(a),e=pd(b);if(!d||!e)return 0;while(d<e){d.setDate(d.getDate()+1);const w=d.getDay();if(w&&w<6)n++}return n}
function periodoDe(s){const d=pd(s);if(!d)return '';let y=d.getFullYear(),m=d.getMonth()+1;if(d.getDate()>=26){m++;if(m>12){m=1;y++}}return y+'-'+String(m).padStart(2,'0')}
function rangoPeriodo(p){const [y,m]=p.split('-').map(Number);const a=new Date(y,m-2,26),b=new Date(y,m-1,25);return fmtL(a)+' al '+fmtL(b)}
const fmtL=d=>d.toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'});
const cliOf=o=>S.cli.find(c=>c.id===o.clienteId)||null;
const nomCli=o=>{const c=cliOf(o);return c?(c.nombre||c.id):(o.clienteId||'Sin cliente')};
const abierta=o=>ABIERTAS.includes(o.etapa);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}

/* ---------- datos ---------- */
function rows(s){const a=Array.isArray(s)?s:(s&&(s.docs||s.items||s.rows||s.documents))||[];return a.map(d=>{const data=typeof d.data==='function'?d.data():(d.data&&typeof d.data==='object'?d.data:d);return Object.assign({},data,{id:d.id||(d.path||'').split('/').pop()||data.id})})}
async function save(col,id,data){if(!S.db){toast('Sin conexión a la base de datos');return false}try{await S.db.doc(col+'/'+id).set(data);return true}catch(e){toast('No se pudo guardar: '+(e.message||e.code||'error'));return false}}
function boot(){
  const cfg=window.AGROVEX_FIREBASE;
  if(!window.firebase||!cfg||!cfg.apiKey||cfg.apiKey.startsWith('PEGAR')){S.err='Falta configurar Firebase (archivo config.js).';S.ready=true;render();return}
  firebase.initializeApp(cfg);
  const auth=firebase.auth(),db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  S.auth=auth;S.db=db;
  window.addEventListener('online',()=>{S.offline=false;render()});window.addEventListener('offline',()=>{S.offline=true;render()});S.offline=!navigator.onLine;
  auth.onAuthStateChanged(u=>{
    S.user=u;(S.unsub||[]).forEach(f=>f());S.unsub=[];
    for(const id of ['logout','logoutM'])$(id).style.display=u?'':'none';
    $('who').textContent=u?u.email:'';
    if(!u){S.ready=true;S.cli=[];S.ops=[];render();return}
    S.ready=false;render();
    let a=false,b=false;const done=()=>{if(a&&b){S.ready=true}render()};
    const err=e=>{S.err=e&&e.code==='permission-denied'?'Tu usuario no tiene permiso para ver los datos. Pide al GG que te agregue.':'Error leyendo datos: '+(e&&e.message||'');S.ready=true;render()};
    S.unsub.push(db.collection('clientes').onSnapshot(sn=>{S.cli=rows(sn).sort((x,y)=>String(x.id).localeCompare(y.id));S.pend=sn.metadata&&sn.metadata.hasPendingWrites;a=true;done()},err));
    S.unsub.push(db.collection('ops').onSnapshot({includeMetadataChanges:true},sn=>{S.ops=rows(sn);S.pend=sn.metadata&&sn.metadata.hasPendingWrites;b=true;done()},err));
  });
}

/* ---------- reglas del Seguidor ---------- */
function seguidor(){
  const t=today(),fin=iso(new Date(pd(t).getTime()+(7-((pd(t).getDay()+6)%7)-1)*864e5));
  const lista=[],sinPaso=[],decision=[];
  for(const o of S.ops){
    if(!abierta(o))continue;
    const c=cliOf(o);
    if(c&&c.contactable===false)continue;
    if(c&&c.deuda){decision.push({o,motivo:'Deuda vencida: no cotizar ni dar crédito sin decisión del GG'});continue}
    const dsc=o.ultimoContacto?days(o.ultimoContacto,t):null,bd=o.ultimoContacto?bdays(o.ultimoContacto,t):0,tq=+o.toques||0;
    const ventana=o.ventana&&days(t,o.ventana)>=0&&days(t,o.ventana)<=7;
    let it=null;
    if(o.fechaAcordada&&o.fechaAcordada<=fin){it={tipo:o.fechaAcordada<t?'Compromiso vencido':'Compromiso esta semana',cls:o.fechaAcordada<t?'r':'a',accion:o.etapa==='ensayo en curso'?'evaluacion':'compromiso'}}
    else if(o.etapa==='consulta'&&bd>2){it={tipo:'Consulta sin respuesta',cls:'r',accion:'consulta'}}
    else if(!o.fechaAcordada&&['cotización enviada','seguimiento'].includes(o.etapa)&&o.ultimoContacto){
      if(tq>=3)decision.push({o,motivo:'3 toques sin respuesta: proponer pasar a pausada (no contestó más)'});
      else if(tq===0&&bd>=3)it={tipo:'1er toque',cls:'',accion:'toque1'};
      else if(tq===1&&dsc>=10)it={tipo:'2do toque',cls:'',accion:'toque2'};
      else if(tq===2&&dsc>=20)it={tipo:'3er toque (último)',cls:'o',accion:'toque3'};
    }
    if(it){it.o=o;it.ventana=ventana;lista.push(it)}
    if(!o.fechaAcordada&&!(o.proximoPaso||'').trim())sinPaso.push(o);
  }
  const by=(a,b)=>(+b.o.monto||0)-(+a.o.monto||0);
  lista.sort(by);decision.sort(by);sinPaso.sort((a,b)=>(+b.monto||0)-(+a.monto||0));
  const abiertas=S.ops.filter(abierta).length;
  return {lista,sinPaso,decision,abiertas,conPaso:abiertas-sinPaso.length-S.ops.filter(o=>abierta(o)&&o.fechaAcordada&&o.fechaAcordada<t).length};
}
function plantilla(it){
  const o=it.o,c=cliOf(o)||{},n=c.nombre||'',tu=c.tono==='tú',f=o.ultimoContacto?fmt(o.ultimoContacto):'';
  const s=(u,t)=>tu?t:u,h='Hola'+(n?' '+n:'')+', ';
  const v=it.ventana&&o.ventana?(s(' Recuerde',' Recuerda')+' que su ventana de aplicación registrada es hasta el '+fmt(o.ventana)+'.'):'';
  switch(it.accion){
  case 'toque1':return h+s('le escribo para confirmar que le llegó la cotización','te escribo para confirmar que te llegó la cotización')+(f?' del '+f:'')+'. '+s('Si quiere la revisamos juntos o ajusto algo, me avisa.','Si quieres la revisamos juntos o ajusto algo, me avisas.')+v;
  case 'toque2':return h+s('le comparto un dato útil sobre','te comparto un dato útil sobre')+' '+(o.producto||'lo que conversamos')+(o.cultivo?' para su '+o.cultivo:'')+': [agregar dato técnico de la ficha]. '+s('¿Le acomoda que lo veamos en terreno esta semana?','¿Te acomoda que lo veamos en terreno esta semana?')+v;
  case 'toque3':return h+s('no quiero ser insistente, así que este es mi último mensaje por la cotización','no quiero ser insistente, así que este es mi último mensaje por la cotización')+(f?' del '+f:'')+'. '+s('Si hoy no es el momento, la dejo en pausa y quedo a disposición. Si cambia algo, me escribe por acá.','Si hoy no es el momento, la dejo en pausa y quedo atento. Si cambia algo, me escribes por acá.');
  case 'consulta':return h+s('gracias por su consulta','gracias por tu consulta')+(o.necesidad?' sobre '+o.necesidad:'')+'. '+s('Para recomendarle bien, ¿le parece si paso por el predio','Para recomendarte bien, ¿te parece si paso por el predio')+' [día]?';
  case 'evaluacion':return h+s('¿le acomoda que pasemos el','¿te acomoda que pasemos el')+' '+fmt(o.fechaAcordada)+' a evaluar juntos el ensayo'+(o.producto?' de '+o.producto:'')+'?';
  default:return h+s('como quedamos, le escribo por','como quedamos, te escribo por')+' '+(o.proximoPaso||o.producto||'lo conversado')+'. '+s('¿Cómo lo ve?','¿Cómo lo ves?')+v;
  }
}

  h+='<form class="form" id="fC"><label>Fecha de cierre<input name="fecha" type="date" value="'+today()+'"></label><label>Monto (CLP)<input name="monto" type="number" step="1000" min="0" value="'+esc(o.monto)+'"></label>';
  if(res==='ganada'){h+='<label>Hectáreas captadas<input name="ha" type="number" step="0.1" min="0" value="'+esc(o.haCultivo)+'"></label><label>Pago<select name="pago"><option>contado</option>'+(apto?'<option>crédito 30 días</option>':'')+'</select></label>'+(apto?'':'<div class="alert a full">Solo contado: el cliente tiene '+(+c.comprasContado||0)+' compras al contado y el crédito parte con 3. Una excepción la decide el GG.</div>')+'<label class="full" style="flex-direction:row;align-items:center;gap:10px"><input type="checkbox" name="sumar" checked style="min-height:auto;width:20px;height:20px"> Sumar una compra al contado a la ficha del cliente (si el pago es contado)</label>'}
  else h+='<label class="full">Motivo de pérdida<select name="motivo" required><option value="">Elige el motivo</option>'+opt(MOTIVOS,'')+'</select></label>';
  h+='</form><div class="mfoot"><span></span><div style="display:flex;gap:8px"><button class="btn alt" data-close>Cancelar</button><button class="btn" id="saveC">Confirmar</button></div></div>';
  open(h);
  $('saveC').onclick=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData($('fC')));
    if(res==='perdida'&&!f.motivo){toast('Toda pérdida lleva motivo');return}
    const cierre={fecha:f.fecha||today(),monto:+f.monto||0};if(res==='ganada'){cierre.ha=+f.ha||0;cierre.pago=f.pago||'contado'}else cierre.motivo=f.motivo;
    const d=Object.assign({},o,{etapa:res,cierre});delete d.id;
    if(await save('ops',id,d)){if(res==='ganada'&&cierre.pago==='contado'&&f.sumar&&c.id){const cd=Object.assign({},c,{comprasContado:(+c.comprasContado||0)+1});delete cd.id;await save('clientes',c.id,cd)}close();toast(res==='ganada'?'¡Venta registrada!':'Pérdida registrada con su motivo')}};
}
function editarCli(id){
  const c=S.cli.find(x=>x.id===id)||{comprasContado:0,tono:'usted',contactable:true,deuda:false,pago:'contado'};const isNew=!id;
  let h=head(isNew?'Nuevo cliente':esc(c.id)+' · '+esc(c.nombre));
  h+='<form class="form" id="fCl"><label>Código<input name="codigo" value="'+esc(isNew?nextCliId():c.id)+'" '+(isNew?'':'readonly')+'></label><label>Nombre de pila<input name="nombre" value="'+esc(c.nombre)+'" required></label>';
  h+='<label>Comuna<select name="comuna">'+opt(COMUNAS,c.comuna)+'</select></label><label>Sector o predio<input name="sector" value="'+esc(c.sector)+'"></label>';
  h+='<label>Ha totales<input name="ha" type="number" step="0.1" min="0" value="'+esc(c.ha)+'"></label><label>Cultivos<input name="cultivos" value="'+esc(c.cultivos)+'" placeholder="ciruelo, tomate"></label>';
  h+='<label>Temporada de compra<input name="temporada" value="'+esc(c.temporada)+'" placeholder="sep–nov"></label><label>Compras al contado<input name="comprasContado" type="number" min="0" value="'+esc(c.comprasContado||0)+'"></label>';
  h+='<label>Tono<select name="tono">'+opt(['usted','tú'],c.tono)+'</select></label><label>Quién decide<input name="decide" value="'+esc(c.decide)+'"></label>';
  h+='<label>¿Deuda vencida?<select name="deuda">'+opt(['no','sí'],c.deuda?'sí':'no')+'</select></label><label>¿Se puede contactar?<select name="contactable">'+opt(['sí','no contactar'],c.contactable===false?'no contactar':'sí')+'</select></label>';
  h+='<label class="full">Notas<textarea name="notas" placeholder="Qué le importa, cómo decide">'+esc(c.notas)+'</textarea></label></form>';
  h+='<p class="status">'+((+c.comprasContado||0)>=3?'Apto para crédito a 30 días.':'Solo contado hasta completar 3 compras al contado.')+' Sin RUT ni datos bancarios.</p>';
  h+='<div class="mfoot"><span></span><div style="display:flex;gap:8px"><button class="btn alt" data-close>Cancelar</button><button class="btn" id="saveCl">Guardar</button></div></div>';
  open(h);
  $('saveCl').onclick=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData($('fCl')));
    const cid=(f.codigo||'').trim().toUpperCase();if(!cid||!f.nombre){toast('Falta código o nombre');return}
    if(isNew&&S.cli.some(x=>x.id===cid)){toast('Ese código ya existe');return}
    if(/\d{1,2}\.?\d{3}\.?\d{3}-[\dkK]/.test(f.notas||'')){toast('Saca el RUT de las notas');return}
    const d={nombre:f.nombre.trim(),comuna:f.comuna,sector:f.sector,ha:f.ha===''?'':+f.ha,cultivos:f.cultivos,temporada:f.temporada,comprasContado:+f.comprasContado||0,tono:f.tono,decide:f.decide,deuda:f.deuda==='sí',contactable:f.contactable!=='no contactar',notas:f.notas,pago:(+f.comprasContado||0)>=3?'crédito 30 días':'contado'};
    if(await save('clientes',cid,d)){close();toast(isNew?'Cliente creado':'Ficha guardada')}};
}

/* ---------- render y eventos ---------- */
function route(){const h=location.hash.slice(1);return PAGES.some(p=>p[0]===h)?h:'inicio'}
function render(){
  const r=route();
  const nav=PAGES.map(([k,l])=>'<a href="#'+k+'" class="'+(k===r?'on':'')+'"'+(k===r?' aria-current="page"':'')+'>'+ico(k)+'<span>'+l+'</span></a>').join('');
  $('navSide').innerHTML=nav;$('navTabs').innerHTML=nav;
  const m=$('main');
  document.body.classList.toggle('out',!!(S.auth&&!S.user));
  if(S.auth&&!S.user&&S.ready){m.innerHTML=vLogin();bindLogin();return}
  if(!S.ready){m.innerHTML='<div class="empty"><svg width="56" height="56" aria-hidden="true"><use href="#iso"/></svg><br>Conectando con la base de datos…</div>';return}
  const v={inicio:vInicio,lunes:vLunes,tablero:vTablero,clientes:vClientes,visita:vVisita,cierre:vCierre,guia:vGuia}[r];
  const y=window.scrollY,a=document.activeElement&&document.activeElement.id;
  m.innerHTML=(S.err?'<div class="alert r">'+esc(S.err)+'</div>':'')+(S.offline?'<div class="alert a">Sin señal: lo que registres se guarda en el teléfono y se sincroniza al volver.</div>':'')+'<div class="view'+(S.lastRoute===r?'" style="animation:none':'')+'">'+v()+'</div>';
  if(S.lastRoute===r){window.scrollTo(0,y);if(a&&$(a)){const el=$(a);el.focus();if(el.setSelectionRange&&el.type==='search'){const l=el.value.length;el.setSelectionRange(l,l)}}}else window.scrollTo(0,0);
  S.lastRoute=r;
}
window.addEventListener('hashchange',render);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-go],[data-new],[data-op],[data-cli],[data-draft],[data-copy],[data-sent],[data-close],[data-win],[data-lose],[data-reopen],#vAi,#cAi');if(!b)return;
  const d=b.dataset;
  if(d.go){location.hash=d.go}
  else if(d.new==='op'){e.preventDefault();editarOp(null,'',d.cliFor||'')}
  else if(d.new==='cli'){e.preventDefault();editarCli(null)}
  else if(d.op){editarOp(d.op)}
  else if(d.cli){editarCli(d.cli)}
  else if(d.draft){redactar(d.draft)}
  else if(d.copy){copiar(S.drafts[d.copy]||'')}
  else if(d.sent){marcarEnviado(d.sent)}
  else if('close' in d){e.preventDefault();close()}
  else if(d.win){cerrarOp(d.win,'ganada')}
  else if(d.lose){cerrarOp(d.lose,'perdida')}
  else if(d.reopen){const o=S.ops.find(x=>x.id===d.reopen);if(o){const n=Object.assign({},o,{etapa:'seguimiento',ultimoContacto:today()});delete n.id;delete n.cierre;save('ops',o.id,n).then(ok=>{if(ok){close();toast('Reabierta')}})}}
  else if(b.id==='vAi'){afinarVisita()}
  else if(b.id==='cAi'){lecturaCierre()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='fResp'){S.fResp=t.value;render()}else if(t.id==='vSel'){S.visita=t.value;render()}else if(t.id==='pSel'){S.periodo=t.value;render()}});
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function bindLogin(){
  $('fLogin').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));$('lmsg').textContent='Entrando…';
    try{await S.auth.signInWithEmailAndPassword(f.email.trim(),f.pass)}catch(err){$('lmsg').textContent=err.code==='auth/network-request-failed'?'Sin conexión. Intenta de nuevo con señal.':'Correo o contraseña incorrectos.'}};
  $('reset').onclick=async()=>{const em=$('fLogin').email.value.trim();if(!em){$('lmsg').textContent='Escribe tu correo primero.';return}
    try{await S.auth.sendPasswordResetEmail(em);$('lmsg').textContent='Te enviamos un correo para crear una nueva contraseña.'}catch(err){$('lmsg').textContent='No pudimos enviar el correo. Revisa la dirección.'}};
}
for(const id of ['logout','logoutM'])$(id).onclick=()=>S.auth&&S.auth.signOut();
document.addEventListener('click',e=>{if(e.target.closest('#exp'))exportar()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();boot();
}
</script>
</body>
</html>
